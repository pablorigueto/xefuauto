<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XefuAuto</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#0f172a; color:#e2e8f0;
         font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
         display:flex; align-items:center; justify-content:center;
         min-height:100vh; padding:24px; }
  main { max-width:640px; width:100%; }
  h1 { font-size:2rem; margin:0 0 .3em; }
  .sub { color:#94a3b8; margin:0 0 2em; font-size:1.05rem; }
  a.card { display:block; background:#1e293b; border:1px solid #334155;
           border-radius:10px; padding:18px 20px; margin-bottom:14px;
           text-decoration:none; color:inherit; transition:border-color .15s; }
  a.card:hover { border-color:#38bdf8; }
  a.card b { color:#38bdf8; display:block; font-size:1.1rem; margin-bottom:4px; }
  a.card span { color:#94a3b8; font-size:.95rem; }
  footer { margin-top:2em; color:#64748b; font-size:.9rem; line-height:1.6; }
  footer a { color:#94a3b8; }
</style>
</head>
<body>
<main>
  <h1>XefuAuto</h1>
  <p class="sub">The right xefu, automatically, for every Xbox Classic game
    on an RGH/JTAG Xbox&nbsp;360.</p>

  <a class="card" href="compat/">
    <b>Compatibility list &rarr;</b>
    <span>All 1024 games, searchable and filterable in your browser.</span>
  </a>

  <a class="card" href="https://github.com/pablorigueto/xefuauto">
    <b>Project on GitHub &rarr;</b>
    <span>Download, setup guide and the editable table.</span>
  </a>

  <footer>
    Compatibility data from the
    <a href="https://consolemods.org/wiki/Xbox_360:Original_Xbox_Games_Compatibility_List">ConsoleMods
    community list</a>.
  </footer>
</main>
</body>
</html>
