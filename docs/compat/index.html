<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1120">
<meta name="description" content="Xbox Original games compatibility list for Xbox 360 RGH — which xefu version each game needs.">
<title>Xbox Classic Compatibility — XefuAuto</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:dark;
  --bg:#0b1120; --card:#151f34; --card2:#1b2740; --line:#26334d;
  --tx:#e8eef7; --dim:#93a4bd; --accent:#38bdf8;
  --s0:#16a34a; --s1:#4ade80; --s2:#facc15;
  --s3:#fb923c; --s4:#f87171; --s5:#b91c1c; --s6:#64748b;
  --pad:16px;
}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--tx);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
}
a{color:var(--accent)}

/* ---------- topo fixo ---------- */
header{
  position:sticky; top:0; z-index:20; background:rgba(11,17,32,.97);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 12px) var(--pad) 10px;
}
h1{font-size:1.15rem; margin:0 0 2px; letter-spacing:-.01em}
h1 span{color:var(--accent)}
.sub{margin:0 0 10px; color:var(--dim); font-size:.82rem}
.search{position:relative}
.search input{
  width:100%; padding:12px 40px 12px 14px; font-size:16px;
  background:var(--card); color:var(--tx);
  border:1px solid var(--line); border-radius:10px; outline:none;
}
.search input:focus{border-color:var(--accent)}
.clear{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  background:none; border:0; color:var(--dim); font-size:1.3rem;
  padding:6px 10px; cursor:pointer; line-height:1;
}
/* filtros: quebram em linhas para todos ficarem visiveis de cara */
.chips{
  display:flex; flex-wrap:wrap; gap:6px; padding:10px 0 2px;
}
.chip{
  flex:0 1 auto; padding:6px 10px; border-radius:999px; cursor:pointer;
  background:var(--card); border:1px solid var(--line);
  color:var(--dim); font-size:.76rem; white-space:nowrap;
}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#07121f; font-weight:600}
.chip i{font-style:normal; opacity:.75; margin-left:5px}
.selects{display:flex; gap:8px; padding:8px 0 2px}
.selects select{
  flex:1 1 0; min-width:0; padding:8px 10px; font-size:.82rem;
  background:var(--card); color:var(--tx);
  border:1px solid var(--line); border-radius:9px; outline:none;
}
.selects select:focus{border-color:var(--accent)}

/* ---------- lista ---------- */
main{padding:var(--pad); max-width:900px; margin:0 auto}
.count{color:var(--dim); font-size:.82rem; margin:0 0 12px}
.game{
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  margin-bottom:10px; overflow:hidden;
}
.game > summary{
  display:flex; align-items:center; gap:10px; padding:13px 14px;
  cursor:pointer; list-style:none;
}
.game > summary::-webkit-details-marker{display:none}
.dot{flex:0 0 auto; width:10px; height:10px; border-radius:50%}
.nm{flex:1 1 auto; min-width:0; font-weight:600; font-size:.95rem;
    overflow-wrap:anywhere; text-align:left; background:none; border:0;
    color:inherit; font-family:inherit; padding:0; cursor:pointer}
.nm:hover{color:var(--accent)}
.xf{
  flex:0 0 auto; font-size:.78rem; font-weight:700; color:var(--accent);
  background:rgba(56,189,248,.12); padding:4px 9px; border-radius:6px;
  white-space:nowrap;
}
.meta{display:flex; flex-wrap:wrap; gap:6px; padding:0 14px 11px; align-items:center}
.tag{font-size:.7rem; padding:3px 8px; border-radius:5px;
     background:var(--card2); color:var(--dim); white-space:nowrap}
.tag.co{background:rgba(74,222,128,.13); color:#86efac; font-weight:600}
.st{color:var(--dim); font-size:.72rem}

/* detalhe */
.detail{padding:4px 14px 14px; border-top:1px solid var(--line); margin-top:4px}
.grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr));
  gap:6px; margin:12px 0;
}
.v{background:var(--card2); border-radius:7px; padding:7px 4px; text-align:center}
.v b{display:block; font-size:.74rem; color:var(--dim); font-weight:600}
.v u{display:block; height:4px; border-radius:2px; margin-top:5px; text-decoration:none}
.note{font-size:.85rem; color:#c8d6ea; margin:10px 0 0}
.note b{color:var(--dim); font-weight:600; display:block; font-size:.74rem;
        text-transform:uppercase; letter-spacing:.04em; margin-bottom:3px}
.empty{text-align:center; color:var(--dim); padding:48px 16px}

/* ---------- modal da capa ---------- */
dialog.cover{
  border:0; padding:0; background:transparent; max-width:92vw; max-height:92vh;
  color:var(--tx); overflow:visible;
}
dialog.cover::backdrop{background:rgba(3,7,18,.86)}
.cover-box{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:14px; max-width:420px; text-align:center;
}
.cover-box img{
  width:100%; height:auto; max-height:62vh; object-fit:contain;
  border-radius:8px; background:var(--card2); display:block;
}
.cover-box h2{font-size:1rem; margin:12px 4px 4px; line-height:1.35}
.cover-box p{margin:0 4px 12px; color:var(--dim); font-size:.8rem}
.cover-close{
  width:100%; padding:11px; font-size:.92rem; font-weight:600; cursor:pointer;
  background:var(--accent); color:#07121f; border:0; border-radius:9px;
}
.cover-miss{padding:40px 16px; color:var(--dim); font-size:.9rem}

footer{
  max-width:900px; margin:0 auto; padding:24px var(--pad) 40px;
  color:#5f708a; font-size:.78rem; line-height:1.7;
  border-top:1px solid var(--line);
}

/* ---------- telas maiores ---------- */
@media (min-width:640px){
  :root{--pad:24px}
  h1{font-size:1.4rem}
  .sub{font-size:.9rem}
  .game > summary{padding:15px 18px}
  .nm{font-size:1rem}
}
</style>
</head>

</dialog>

","666666066666","","/u/schmatzler",1,[0],"TT/140"],["Zeta Quadrant",5,"xefu7 +config","666666566666","Crashes on Xbox logo","szymmirr",0,[],""],["ZillerNet",2,"xefu7 +config","666666266666","No lyrics or menu overlay. Pressing A button pauses the video.","Stikmars, szymmirr",4,[],"ST/001"]];
const GENRES = ["Adventure", "Arcade", "Card & Board Game", "Fighting", "Hack and slash", "Indie", "Music", "Pinball", "Platform", "Point-and-click", "Puzzle", "Quiz", "Racing", "Real Time Strategy (RTS)", "Role-playing (RPG)", "Shooter", "Simulator", "Sport", "Strategy", "Tactical", "Turn-based strategy (TBS)", "Visual Novel"];

const list=document.getElementById('list'), countEl=document.getElementById('count'),
      q=document.getElementById('q'), clearBtn=document.getElementById('clear'),
      chipBox=document.getElementById('chips'),
      selGen=document.getElementById('genre'),
      selPly=document.getElementById('players');

// normaliza para busca tolerante a acento/pontuacao
const norm = s => s.toLowerCase().normalize('NFD')
  .replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
// pre-calcula: [9] = indice original, [10] = chave de busca
DATA.forEach((g,i) => { g[9] = i; g[10] = norm(g[0]); });
const KEY = g => g[10];

// filtros de status: conjunto vazio = todos
let filtros = new Set();

// chips: Todos + um por status existente.
// Rotulo curto para caberem todos na tela do celular; o nome completo
// fica no title/aria-label.
const CURTO = {'Officially supported':'Supported'};
const usados = [...new Set(DATA.map(g=>g[1]))].sort((a,b)=>a-b);
const chips = [[-1,'All','All',DATA.length]].concat(
  usados.map(i => [i, CURTO[STATUS[i]] || STATUS[i], STATUS[i],
                   DATA.filter(g=>g[1]===i).length]));
chipBox.innerHTML = chips.map(([i,rot,titulo,n]) =>
  `<button class="chip" data-s="${i}" aria-pressed="${i===-1}"` +
  ` title="${titulo}" aria-label="${titulo}, ${n} games">${rot}<i>${n}</i></button>`
).join('');

// Varios status podem ficar ativos ao mesmo tempo; "All" limpa a selecao.
chipBox.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if(!b) return;
  const v = +b.dataset.s;
  if (v === -1) filtros.clear();
  else if (filtros.has(v)) filtros.delete(v);
  else filtros.add(v);
  chipBox.querySelectorAll('.chip').forEach(c => {
    const cv = +c.dataset.s;
    c.setAttribute('aria-pressed',
      cv === -1 ? filtros.size === 0 : filtros.has(cv));
  });
  render();
});

selGen.innerHTML = '<option value="-1">Any genre</option>' +
  GENRES.map((g,i) => `<option value="${i}">${g}</option>`).join('');
selGen.addEventListener('change', render);
selPly.addEventListener('change', render);

q.addEventListener('input', () => { clearBtn.hidden = !q.value; render(); });
clearBtn.addEventListener('click', () => {
  q.value=''; clearBtn.hidden=true; render(); q.focus();
});

function cartao(g){
  const [nome, st, xefu, vs, notas, testado, players, gens] = g;
  const tags = [];
  if (players >= 2) tags.push(
    `<span class="tag co">${players} players local</span>`);
  else if (players === 1) tags.push('<span class="tag">Single player</span>');
  (gens||[]).forEach(i => tags.push(`<span class="tag">${esc(GENRES[i])}</span>`));
  const versoes = VERS.map((v,i) =>
    `<span class="v"><b>${v}</b><u style="background:var(--s${vs[i]})"></u></span>`).join('');
  const nota = notas ? `<p class="note"><b>Known issues</b>${esc(notas)}</p>` : '';
  const quem = testado ? `<p class="note"><b>Tested by</b>${esc(testado)}</p>` : '';
  return `<details class="game">
    <summary>
      <span class="dot" style="background:var(--s${st})"></span>
      <button class="nm" data-i="${g[9]}">${esc(nome)}</button>
      ${xefu ? `<span class="xf">${esc(xefu)}</span>` : ''}
    </summary>
    <div class="meta">${tags.join('')}<span class="st">${STATUS[st]}</span></div>
    <div class="detail">
      <div class="grid">${versoes}</div>
      ${nota}${quem}
    </div>
  </details>`;
}

const esc = s => String(s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- modal da capa ----------
const modal=document.getElementById('modal'),
      mImg=document.getElementById('modalImg'),
      mName=document.getElementById('modalName'),
      mInfo=document.getElementById('modalInfo');
const CDN='https://cdn.jsdelivr.net/gh/xemu-project/xdb@main/titles/';

function abrirCapa(g){
  const [nome, st, xefu, , , , players, gens, capa] = g;
  mName.textContent = nome;
  const partes = [STATUS[st]];
  if (xefu)      partes.push(xefu);
  if (players>=2) partes.push(players + ' players local');
  else if (players===1) partes.push('Single player');
  (gens||[]).forEach(i => partes.push(GENRES[i]));
  mInfo.textContent = partes.join('  ·  ');

  mImg.innerHTML = capa
    ? `<img src="${CDN}${capa}/cover_front.jpg" alt="${esc(nome)} cover"
         loading="lazy" onerror="this.parentNode.innerHTML=
         '<p class=cover-miss>Cover not available</p>'">`
    : '<p class="cover-miss">Cover not available</p>';

  if (modal.showModal) modal.showModal(); else modal.setAttribute('open','');
}
document.getElementById('modalClose').addEventListener('click',
  () => modal.close ? modal.close() : modal.removeAttribute('open'));
modal.addEventListener('click', e => {           // clique fora fecha
  if (e.target === modal) modal.close();
});
list.addEventListener('click', e => {
  const b = e.target.closest('.nm'); if(!b) return;
  e.preventDefault();
  abrirCapa(DATA[+b.dataset.i]);
});

function render(){
  const termo = norm(q.value);
  const gen = +selGen.value, ply = +selPly.value;
  let r = DATA;
  if (filtros.size) r = r.filter(g => filtros.has(g[1]));
  if (gen >= 0)    r = r.filter(g => (g[7]||[]).includes(gen));
  if (ply > 0)     r = r.filter(g => g[6] >= ply);
  if (termo)       r = r.filter(g => KEY(g).includes(termo));
  countEl.textContent = r.length + (r.length===1 ? ' game' : ' games');
  list.innerHTML = r.length
    ? r.map(cartao).join('')
    : '<p class="empty">No game found.</p>';
}
render();
</script>
